name: appointment_app
description: GuwahatiOne Clinic OS — Open-source clinic & chamber management platform
publish_to: 'none'

version: 1.8.2+10

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.10.0
  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  uuid: ^4.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png