<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GuwahatiOne Clinic OS — OPD Queue &amp; Consultation Management">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GuwahatiOne Clinic OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GuwahatiOne Clinic OS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.playClinicChime = function(tokenNumber, doctorName) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          const now = ctx.currentTime;
          // Dual-frequency pleasant clinic ding-dong chime (D5 -> A5)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.25, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.35);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880.0, now + 0.18);
          gain2.gain.setValueAtTime(0.25, now + 0.18);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.18);
          osc2.stop(now + 0.6);
        }

        if (window.speechSynthesis && tokenNumber) {
          setTimeout(function() {
            try {
              window.speechSynthesis.cancel();
              const text = doctorName
                ? "Token " + tokenNumber + ", please proceed to " + doctorName
                : "Token " + tokenNumber + ", please proceed to the doctor chamber";
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.rate = 0.95;
              utterance.pitch = 1.0;
              utterance.lang = 'en-IN';
              window.speechSynthesis.speak(utterance);
            } catch (e) {
              console.warn("SpeechSynthesis error:", e);
            }
          }, 650);
        }
      } catch (err) {
        console.warn("Audio chime error:", err);
      }
    };

    window.downloadTextFile = function(filename, content, mimeType) {
      try {
        const blob = new Blob([content], { type: mimeType || 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      } catch (e) {
        console.error('File download failed:', e);
      }
    };

    window.printHtmlDocument = function(htmlContent) {
      try {
        let iframe = document.getElementById('clinic_print_frame');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.id = 'clinic_print_frame';
          iframe.style.position = 'fixed';
          iframe.style.right = '0';
          iframe.style.bottom = '0';
          iframe.style.width = '0';
          iframe.style.height = '0';
          iframe.style.border = '0';
          document.body.appendChild(iframe);
        }
        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(htmlContent);
        doc.close();
        setTimeout(function() {
          try {
            iframe.contentWindow.focus();
            iframe.contentWindow.print();
          } catch (e) {
            console.error('Print trigger failed:', e);
          }
        }, 350);
      } catch (err) {
        console.error('Print iframe error:', err);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
